<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <defs>
    <radialGradient id="guacGrad" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#b8d948" />
      <stop offset="50%" stop-color="#8fbf30" />
      <stop offset="100%" stop-color="#6a9a20" />
    </radialGradient>
    <radialGradient id="bowlGrad" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#d4a44a" />
      <stop offset="100%" stop-color="#a67c30" />
    </radialGradient>
    <radialGradient id="bowlInner" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#c49840" />
      <stop offset="100%" stop-color="#8a6520" />
    </radialGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d88a" />
      <stop offset="100%" stop-color="#d4b45a" />
    </linearGradient>
    <linearGradient id="chipGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cc78" />
      <stop offset="100%" stop-color="#c8a448" />
    </linearGradient>
  </defs>

  <!-- Bowl shadow -->
  <ellipse cx="150" cy="225" rx="100" ry="18" fill="rgba(0,0,0,0.12)" />

  <!-- Bowl body -->
  <path d="M50 140 Q50 220 150 225 Q250 220 250 140 Z" fill="url(#bowlGrad)" />
  <!-- Bowl rim -->
  <ellipse cx="150" cy="140" rx="100" ry="25" fill="#d4a44a" stroke="#b8922e" stroke-width="2" />
  <ellipse cx="150" cy="140" rx="92" ry="20" fill="url(#bowlInner)" />

  <!-- Guacamole surface -->
  <ellipse cx="150" cy="138" rx="88" ry="18" fill="url(#guacGrad)" />

  <!-- Guac texture - chunky bits -->
  <circle cx="125" cy="134" r="6" fill="#9ec838" opacity="0.6" />
  <circle cx="165" cy="132" r="5" fill="#a4d03c" opacity="0.5" />
  <circle cx="140" cy="140" r="4" fill="#7aaa20" opacity="0.5" />
  <circle cx="175" cy="138" r="3.5" fill="#9ec838" opacity="0.4" />
  <circle cx="110" cy="138" r="4.5" fill="#a4d03c" opacity="0.5" />

  <!-- Tomato bits -->
  <circle cx="155" cy="136" r="3" fill="#d94040" opacity="0.7" />
  <circle cx="130" cy="139" r="2.5" fill="#cc3535" opacity="0.6" />
  <circle cx="180" cy="135" r="2" fill="#d94040" opacity="0.5" />

  <!-- Onion bits -->
  <circle cx="145" cy="133" r="2" fill="#f5f5dc" opacity="0.5" />
  <circle cx="168" cy="140" r="1.5" fill="#f5f5dc" opacity="0.4" />

  <!-- Cilantro leaves -->
  <g opacity="0.6">
    <path d="M120 130 Q116 126 113 128 Q116 132 120 130Z" fill="#2d7a1e" />
    <path d="M120 130 Q118 124 115 125 Q117 130 120 130Z" fill="#358a22" />
    <path d="M185 133 Q182 129 179 131 Q182 135 185 133Z" fill="#2d7a1e" />
  </g>

  <!-- Tortilla chip 1 - sticking out left -->
  <g transform="translate(70, 105) rotate(-25)">
    <polygon points="0,0 35,-45 50,5" fill="url(#chipGrad)" stroke="#c8a448" stroke-width="1" />
    <line x1="10" y1="-8" x2="30" y2="-25" stroke="#c8a448" stroke-width="0.5" opacity="0.4" />
  </g>

  <!-- Tortilla chip 2 - sticking out right -->
  <g transform="translate(210, 108) rotate(20)">
    <polygon points="0,0 30,-50 55,-5" fill="url(#chipGrad2)" stroke="#b89838" stroke-width="1" />
    <line x1="12" y1="-10" x2="32" y2="-30" stroke="#b89838" stroke-width="0.5" opacity="0.4" />
  </g>

  <!-- Tortilla chip 3 - center back -->
  <g transform="translate(140, 100) rotate(5)">
    <polygon points="0,0 20,-40 40,-2" fill="url(#chipGrad)" stroke="#c8a448" stroke-width="1" />
  </g>

  <!-- Lime wedge on the side -->
  <g transform="translate(248, 180) rotate(15)">
    <path d="M0,0 Q-8,-25 5,-30 Q18,-25 10,0 Z" fill="#a8d840" stroke="#7aaa20" stroke-width="1" />
    <path d="M3,-5 Q-2,-18 5,-22" fill="none" stroke="#c8f060" stroke-width="1" opacity="0.5" />
    <path d="M6,-4 Q2,-16 7,-20" fill="none" stroke="#c8f060" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Bowl decorative pattern -->
  <g opacity="0.25">
    <path d="M70 165 Q80 175 90 165 Q100 175 110 165 Q120 175 130 165 Q140 175 150 165 Q160 175 170 165 Q180 175 190 165 Q200 175 210 165 Q220 175 230 165" fill="none" stroke="#8a6520" stroke-width="2" />
    <path d="M80 185 Q90 195 100 185 Q110 195 120 185 Q130 195 140 185 Q150 195 160 185 Q170 195 180 185 Q190 195 200 185 Q210 195 220 185" fill="none" stroke="#8a6520" stroke-width="1.5" />
  </g>
</svg>
