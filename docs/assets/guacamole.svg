<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <defs>
    <radialGradient id="guacSurface" cx="45%" cy="42%">
      <stop offset="0%" stop-color="#c2e04e" />
      <stop offset="40%" stop-color="#9ecc30" />
      <stop offset="100%" stop-color="#6a9a1e" />
    </radialGradient>
    <radialGradient id="bowlOuter" cx="50%" cy="25%">
      <stop offset="0%" stop-color="#cc6633" />
      <stop offset="100%" stop-color="#993d1a" />
    </radialGradient>
    <radialGradient id="bowlInner" cx="50%" cy="35%">
      <stop offset="0%" stop-color="#b35528" />
      <stop offset="100%" stop-color="#7a3010" />
    </radialGradient>
    <linearGradient id="chipG1" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f2dc8a" />
      <stop offset="100%" stop-color="#d4b45a" />
    </linearGradient>
    <linearGradient id="chipG2" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecd07a" />
      <stop offset="100%" stop-color="#c8a040" />
    </linearGradient>
    <radialGradient id="limeGrad" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#c8f060" />
      <stop offset="60%" stop-color="#90c830" />
      <stop offset="100%" stop-color="#6aaa18" />
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="155" cy="248" rx="110" ry="16" fill="rgba(0,0,0,0.10)" />

  <!-- Bowl body - terracotta style -->
  <path d="M 42,148 Q 45,240 155,245 Q 265,240 268,148 Z" fill="url(#bowlOuter)" />

  <!-- Bowl rim - thick terracotta lip -->
  <ellipse cx="155" cy="148" rx="115" ry="28" fill="#cc6633" stroke="#aa4d1e" stroke-width="2.5" />
  <ellipse cx="155" cy="148" rx="105" ry="22" fill="url(#bowlInner)" />

  <!-- Guacamole surface -->
  <ellipse cx="155" cy="145" rx="100" ry="20" fill="url(#guacSurface)" />

  <!-- Avocado chunks -->
  <ellipse cx="125" cy="140" rx="8" ry="5" fill="#a8d040" opacity="0.6" transform="rotate(-15 125 140)" />
  <ellipse cx="175" cy="138" rx="7" ry="4" fill="#b0d848" opacity="0.5" transform="rotate(20 175 138)" />
  <ellipse cx="145" cy="148" rx="6" ry="4" fill="#90c028" opacity="0.5" transform="rotate(-8 145 148)" />
  <ellipse cx="190" cy="144" rx="5" ry="3.5" fill="#a8d040" opacity="0.45" transform="rotate(10 190 144)" />
  <ellipse cx="108" cy="145" rx="6" ry="3.5" fill="#b0d848" opacity="0.5" transform="rotate(-25 108 145)" />

  <!-- Tomato dice -->
  <rect x="158" y="140" width="5" height="5" rx="1" fill="#dd4040" opacity="0.75" transform="rotate(12 160 142)" />
  <rect x="132" y="144" width="4.5" height="4.5" rx="1" fill="#cc3535" opacity="0.65" transform="rotate(-8 134 146)" />
  <rect x="186" y="140" width="4" height="4" rx="1" fill="#dd4040" opacity="0.55" transform="rotate(25 188 142)" />
  <rect x="115" y="140" width="3.5" height="3.5" rx="1" fill="#cc3535" opacity="0.5" transform="rotate(-15 116 141)" />

  <!-- Onion bits -->
  <path d="M148,138 Q150,135 153,137 Q151,140 148,138Z" fill="#f5f0d8" opacity="0.6" />
  <path d="M170,146 Q172,143 175,145 Q173,148 170,146Z" fill="#f5f0d8" opacity="0.5" />

  <!-- Cilantro leaves -->
  <g opacity="0.7">
    <path d="M122,134 Q116,128 112,130 Q115,136 122,134Z" fill="#2d8a1e" />
    <path d="M122,134 Q118,127 114,128 Q117,134 122,134Z" fill="#38a028" />
    <path d="M121,134 L119,131" fill="none" stroke="#1e6614" stroke-width="0.6" />
  </g>
  <g opacity="0.6">
    <path d="M195,137 Q190,132 187,134 Q190,139 195,137Z" fill="#2d8a1e" />
    <path d="M195,137 Q192,131 189,132 Q191,137 195,137Z" fill="#38a028" />
  </g>

  <!-- Tortilla chip 1 - left, big -->
  <g transform="translate(64, 108) rotate(-22)">
    <path d="M 0,0 L 18,-52 L 52,-8 Q 48,2 40,5 Q 10,6 0,0 Z" fill="url(#chipG1)" stroke="#c0a040" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 8,-8 L 22,-36" fill="none" stroke="#c8a848" stroke-width="0.7" opacity="0.5" />
    <path d="M 20,-4 L 36,-28" fill="none" stroke="#c8a848" stroke-width="0.5" opacity="0.4" />
  </g>

  <!-- Tortilla chip 2 - right -->
  <g transform="translate(224, 110) rotate(18)">
    <path d="M 0,0 L 14,-54 L 50,-10 Q 46,-2 38,2 Q 8,3 0,0 Z" fill="url(#chipG2)" stroke="#b89030" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 10,-10 L 20,-35" fill="none" stroke="#c0a040" stroke-width="0.6" opacity="0.45" />
  </g>

  <!-- Tortilla chip 3 - center back -->
  <g transform="translate(148, 100) rotate(3)">
    <path d="M 0,0 L 12,-44 L 42,-4 Q 36,2 28,4 Q 6,3 0,0 Z" fill="url(#chipG1)" stroke="#c0a040" stroke-width="1" stroke-linejoin="round" />
  </g>

  <!-- Lime half -->
  <g transform="translate(265, 190) rotate(12)">
    <path d="M 0,0 Q -12,-32 6,-40 Q 24,-32 12,0 Z" fill="url(#limeGrad)" stroke="#5a9a10" stroke-width="1.5" />
    <!-- Lime segments -->
    <path d="M 3,-6 Q -4,-22 4,-30" fill="none" stroke="#e0f880" stroke-width="1.2" opacity="0.6" />
    <path d="M 6,-5 Q 1,-20 6,-28" fill="none" stroke="#e0f880" stroke-width="1" opacity="0.5" />
    <path d="M 9,-5 Q 6,-18 9,-25" fill="none" stroke="#e0f880" stroke-width="0.8" opacity="0.45" />
    <!-- Lime rind -->
    <path d="M 0,0 Q -12,-32 6,-40 Q 24,-32 12,0" fill="none" stroke="#4a8810" stroke-width="2.5" />
  </g>

  <!-- Bowl decorative band -->
  <g opacity="0.3">
    <path d="M 62,172 Q 72,180 82,172 Q 92,180 102,172 Q 112,180 122,172 Q 132,180 142,172 Q 152,180 162,172 Q 172,180 182,172 Q 192,180 202,172 Q 212,180 222,172 Q 232,180 242,172" fill="none" stroke="#6a2a0a" stroke-width="2.5" />
    <line x1="58" y1="190" x2="252" y2="190" stroke="#6a2a0a" stroke-width="1.5" />
    <path d="M 68,196 Q 78,204 88,196 Q 98,204 108,196 Q 118,204 128,196 Q 138,204 148,196 Q 158,204 168,196 Q 178,204 188,196 Q 198,204 208,196 Q 218,204 228,196 Q 238,204 248,196" fill="none" stroke="#6a2a0a" stroke-width="2" />
  </g>

  <!-- Bowl highlight (gloss) -->
  <path d="M 70,160 Q 90,155 110,158" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round" />
</svg>
