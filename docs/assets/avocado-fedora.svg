<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 310" width="240" height="310">
  <defs>
    <radialGradient id="afSkin" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#3a6b1e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1a3a0a" stop-opacity="0.4" />
    </radialGradient>
    <radialGradient id="afFlesh" cx="45%" cy="40%">
      <stop offset="0%" stop-color="#e8f5a3" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#b5c94a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8ba83a" stop-opacity="0.3" />
    </radialGradient>
    <radialGradient id="afPit" cx="42%" cy="40%">
      <stop offset="0%" stop-color="#a8842a" />
      <stop offset="100%" stop-color="#6b4e0f" />
    </radialGradient>
    <linearGradient id="crownGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#EE0000" />
      <stop offset="50%" stop-color="#DD0000" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>
    <linearGradient id="brimTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DD0000" />
      <stop offset="100%" stop-color="#AA0000" />
    </linearGradient>
    <linearGradient id="brimUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="100%" stop-color="#700000" />
    </linearGradient>
  </defs>

  <!-- ====== AVOCADO BODY ====== -->
  <ellipse cx="120" cy="185" rx="72" ry="105" fill="#2d5016" />
  <ellipse cx="120" cy="185" rx="72" ry="105" fill="url(#afSkin)" />
  <ellipse cx="120" cy="190" rx="58" ry="88" fill="#c6d94e" />
  <ellipse cx="120" cy="190" rx="58" ry="88" fill="url(#afFlesh)" />
  <ellipse cx="120" cy="205" rx="28" ry="34" fill="#8B6914" />
  <ellipse cx="120" cy="205" rx="28" ry="34" fill="url(#afPit)" />
  <ellipse cx="113" cy="198" rx="12" ry="15" fill="rgba(255,255,255,0.15)" />
  <ellipse cx="98" cy="160" rx="15" ry="30" fill="rgba(255,255,255,0.06)" transform="rotate(-15 98 160)" />

  <!-- ====== RED HAT FEDORA ====== -->
  <!-- Inspired by the Red Hat logo: wide flat brim, low structured crown, sharp pinch -->

  <!-- Shadow on avocado surface -->
  <ellipse cx="120" cy="87" rx="52" ry="7" fill="rgba(0,0,0,0.10)" />

  <!-- Brim underside (dark, visible as front edge thickness) -->
  <path d="M 18,82 Q 120,100 222,82 Q 120,90 18,82 Z" fill="url(#brimUnder)" />

  <!-- Crown - wide, low, structured with a center pinch like the RH logo -->
  <!-- The RH logo fedora has a wide squat crown, deep front pinch, slightly tilted -->
  <path d="
    M 58,80
    C 54,62 60,42 74,30
    Q 82,24 92,28
    L 108,44
    Q 116,50 120,50
    Q 124,50 132,44
    L 148,28
    Q 158,24 166,30
    C 180,42 186,62 182,80
    Z
  " fill="url(#crownGrad)" />

  <!-- Crown left face (slightly darker for depth) -->
  <path d="
    M 58,80
    C 54,62 60,42 74,30
    Q 82,24 92,28
    L 108,44
    Q 116,50 120,50
    L 120,80 Z
  " fill="rgba(0,0,0,0.06)" />

  <!-- Crown highlight stripe (right side) -->
  <path d="M 170,72 C 174,56 170,40 160,32" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round" />

  <!-- Pinch crease shadow -->
  <path d="M 108,44 Q 114,52 120,52 Q 126,52 132,44" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Thin hat band -->
  <path d="
    M 60,76
    Q 120,68 180,76
    L 180,80
    Q 120,72 60,80
    Z
  " fill="#1a1a1a" opacity="0.5" />

  <!-- Brim top surface - wide and flat like the RH logo -->
  <ellipse cx="120" cy="82" rx="100" ry="12" fill="url(#brimTop)" />

  <!-- Brim subtle front curl (the classic RH fedora upward curl at edges) -->
  <path d="M 22,84 Q 60,76 120,80 Q 180,76 218,84" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" />

  <!-- Brim edge definition -->
  <ellipse cx="120" cy="82" rx="99" ry="11" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1" />

  <!-- Brim underside shadow line -->
  <path d="M 24,84 Q 120,96 216,84" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" />
</svg>
