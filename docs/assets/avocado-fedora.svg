<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 310" width="220" height="310">
  <defs>
    <radialGradient id="afSkin" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#3a6b1e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1a3a0a" stop-opacity="0.4" />
    </radialGradient>
    <radialGradient id="afFlesh" cx="45%" cy="40%">
      <stop offset="0%" stop-color="#e8f5a3" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#b5c94a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8ba83a" stop-opacity="0.3" />
    </radialGradient>
    <radialGradient id="afPit" cx="42%" cy="40%">
      <stop offset="0%" stop-color="#a8842a" />
      <stop offset="100%" stop-color="#6b4e0f" />
    </radialGradient>
    <linearGradient id="crownGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#EE0000" />
      <stop offset="40%" stop-color="#DD0000" />
      <stop offset="100%" stop-color="#AA0000" />
    </linearGradient>
    <linearGradient id="brimTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC0000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="brimUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#880000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
  </defs>

  <!-- ====== AVOCADO BODY ====== -->
  <!-- Outer skin -->
  <ellipse cx="110" cy="180" rx="72" ry="105" fill="#2d5016" />
  <ellipse cx="110" cy="180" rx="72" ry="105" fill="url(#afSkin)" />

  <!-- Inner flesh -->
  <ellipse cx="110" cy="185" rx="58" ry="88" fill="#c6d94e" />
  <ellipse cx="110" cy="185" rx="58" ry="88" fill="url(#afFlesh)" />

  <!-- Pit -->
  <ellipse cx="110" cy="200" rx="28" ry="34" fill="#8B6914" />
  <ellipse cx="110" cy="200" rx="28" ry="34" fill="url(#afPit)" />
  <!-- Pit highlight -->
  <ellipse cx="103" cy="193" rx="12" ry="15" fill="rgba(255,255,255,0.15)" />

  <!-- Skin texture highlight -->
  <ellipse cx="88" cy="155" rx="15" ry="30" fill="rgba(255,255,255,0.06)" transform="rotate(-15 88 155)" />

  <!-- ====== FEDORA HAT ====== -->
  <!-- Hat shadow on avocado -->
  <ellipse cx="110" cy="82" rx="55" ry="8" fill="rgba(0,0,0,0.12)" />

  <!-- Brim underside (visible front edge below crown) -->
  <ellipse cx="110" cy="80" rx="80" ry="14" fill="url(#brimUnder)" />

  <!-- Crown body - classic fedora silhouette with center crease -->
  <path d="
    M 52,78
    C 48,58 56,32 72,22
    Q 80,16 88,18
    L 96,28
    Q 104,34 110,34
    Q 116,34 124,28
    L 132,18
    Q 140,16 148,22
    C 164,32 172,58 168,78
    Z
  " fill="url(#crownGrad)" />

  <!-- Crown left shadow (gives 3D depth) -->
  <path d="
    M 52,78
    C 48,58 56,32 72,22
    Q 80,16 88,18
    L 96,28
    Q 104,34 110,34
    L 110,78 Z
  " fill="rgba(0,0,0,0.08)" />

  <!-- Crown right highlight -->
  <path d="
    M 168,78
    C 172,58 164,32 148,22
    Q 140,16 132,18
    L 124,28
    Q 116,34 110,34
    L 110,78 Z
  " fill="rgba(255,255,255,0.06)" />

  <!-- Crease shadow line -->
  <path d="M 96,28 Q 103,36 110,36 Q 117,36 124,28" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-linecap="round" />

  <!-- Crown top highlight (left peak) -->
  <path d="M 62,68 C 58,52 64,36 76,24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Hat band -->
  <path d="
    M 54,72
    Q 54,64 80,61
    Q 110,58 140,61
    Q 166,64 166,72
    Q 166,80 140,77
    Q 110,74 80,77
    Q 54,80 54,72
    Z
  " fill="#1a1a1a" />

  <!-- Band texture lines -->
  <path d="M 60,70 Q 110,64 160,70" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" />
  <path d="M 58,74 Q 110,68 162,74" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" />

  <!-- Band buckle -->
  <rect x="103" y="64" width="14" height="10" rx="2" fill="#d4a44a" />
  <rect x="106" y="66" width="8" height="6" rx="1" fill="#1a1a1a" />
  <!-- Buckle highlight -->
  <line x1="104" y1="65" x2="116" y2="65" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" />

  <!-- Brim top surface -->
  <ellipse cx="110" cy="78" rx="80" ry="13" fill="url(#brimTop)" />

  <!-- Brim edge highlight -->
  <ellipse cx="110" cy="77" rx="78" ry="11" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Brim front curl/shadow -->
  <path d="M 30,78 Q 110,95 190,78" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" />

  <!-- Small Red Hat logo hint on crown (subtle "RH" shape) -->
  <g transform="translate(130, 42) scale(0.35)" opacity="0.2">
    <path d="M 0,0 L 0,20 M 0,10 L 12,10 M 12,0 L 12,20" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
